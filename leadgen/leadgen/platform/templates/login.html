{% extends "base.html" %}
{% block content %}
<div class="auth-form">
  <h2>Log in</h2>
  <form method="post">
    <label>Email
      <input type="email" name="email" required>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit">Log in</button>
  </form>
  <p class="hint">No account yet? <a href="{{ url_for('register') }}">Create one</a></p>
</div>
{% endblock %}
